plugins {
	id 'java'
	id 'idea'
}

java {
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}
compileJava.options.encoding = 'UTF-8'
compileTestJava.options.encoding = 'UTF-8'

repositories {
	mavenCentral()
}

dependencies {
	testImplementation 'junit:junit:4.13.2'
}

tasks.register('testPrimes', Test) {
	group = 'verification'
	description = 'Runs tests for the task to check whether a number is prime'

	testClassesDirs = testing.suites.test.sources.output.classesDirs
	classpath = testing.suites.test.sources.runtimeClasspath

	filter {
		includeTestsMatching('ch.fhnw.algd1.search.prime.*')
	}
}

tasks.register('testSentinel', Test) {
	group = 'verification'
	description = 'Runs tests for the task to search any element using a sentinel'

	testClassesDirs = testing.suites.test.sources.output.classesDirs
	classpath = testing.suites.test.sources.runtimeClasspath

	filter {
		includeTestsMatching('ch.fhnw.algd1.search.sentinelsearch.*')
		excludeTestsMatching('ch.fhnw.algd1.search.sentinelsearch.*First*')
	}
}

tasks.register('testSentinelFirstElem', Test) {
	group = 'verification'
	description = 'Runs tests for the task to search for the first element using a sentinel'

	testClassesDirs = testing.suites.test.sources.output.classesDirs
	classpath = testing.suites.test.sources.runtimeClasspath

	filter {
		includeTestsMatching('ch.fhnw.algd1.search.sentinelsearch.*')
	}
}

tasks.register('testBinSearchObjects', Test) {
	group = 'verification'
	description = 'Runs tests for the task to binarily search an object array'

	testClassesDirs = testing.suites.test.sources.output.classesDirs
	classpath = testing.suites.test.sources.runtimeClasspath

	filter {
		includeTestsMatching('ch.fhnw.algd1.search.binobjectsearch.*')
	}
}

tasks.register('testBinSearchFirstElem', Test) {
	group = 'verification'
	description = 'Runs tests for the task to binarily search for the first occurance in an object array'

	testClassesDirs = testing.suites.test.sources.output.classesDirs
	classpath = testing.suites.test.sources.runtimeClasspath

	filter {
		includeTestsMatching('ch.fhnw.algd1.search.binsearchfirst.*')
	}
}

tasks.register('testSquareRootBisection', Test) {
	group = 'verification'
	description = 'Runs tests for the task to compute square roots through bisection'

	testClassesDirs = testing.suites.test.sources.output.classesDirs
	classpath = testing.suites.test.sources.runtimeClasspath

	filter {
		includeTestsMatching('ch.fhnw.algd1.search.sqrt.*')
	}
